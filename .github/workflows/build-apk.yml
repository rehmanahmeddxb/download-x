name: Build Android APK

# Run the APK build on every push to main, plus manual triggers.
# The signed (or debug) APK is published as a workflow artifact.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    name: Build APK (Buildozer / python-for-android)
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache Buildozer / p4a build
        # Speeds up repeat builds by caching ~/.buildozer (downloaded
        # Android SDK / NDK / recipes / .gradle outputs). The first run
        # will still be slow because everything has to be downloaded.
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            ~/Library/buildozer
          key: ${{ runner.os }}-buildozer-${{ hashFiles('buildozer.spec', 'requirements.txt', 'main.py') }}
          restore-keys: |
            ${{ runner.os }}-buildozer-

      - name: Install Buildozer system dependencies
        # python-for-android needs these system packages on Ubuntu to
        # compile native recipes and run the SDK tooling.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            ccache \
            git \
            libffi-dev \
            libssl-dev \
            libbz2-dev \
            libreadline-dev \
            libsqlite3-dev \
            libncurses5-dev \
            libncursesw5-dev \
            xz-utils \
            tk-dev \
            liblzma-dev \
            python3-pip \
            python3-venv \
            autoconf \
            automake \
            libtool \
            libltdl-dev \
            pkg-config \
            cmake \
            zlib1g-dev \
            unzip \
            zip \
            openjdk-17-jdk-headless \
            wget \
            curl
          # sdkmanager / Gradle need a JDK on PATH; export JAVA_HOME too.
          echo "JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64" >> "$GITHUB_ENV"
          java -version

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade buildozer cython

      - name: Sanitize cached Android SDK
        # Buildozer treats ANY existing SDK dir as "SDK found" and skips
        # installing the command-line tools, then fails when sdkmanager is
        # missing. A failed run can therefore poison the ~/.buildozer
        # cache with a half-installed SDK (e.g. only `licenses/`).
        # Drop such a broken dir so buildozer does a clean SDK install.
        # (SDK licences themselves are accepted via
        # `android.accept_sdk_license = True` in buildozer.spec.)
        run: |
          SDK="$HOME/.buildozer/android/platform/android-sdk"
          if [ -d "$SDK" ] && [ ! -d "$SDK/cmdline-tools" ] && [ ! -x "$SDK/tools/bin/sdkmanager" ]; then
            echo "Removing incomplete cached SDK at $SDK"
            rm -rf "$SDK"
          else
            echo "Cached SDK looks usable (or absent, will be installed)."
          fi

      - name: Record toolchain information
        run: |
          set -o pipefail
          mkdir -p ci-artifacts
          {
            echo "## Toolchain"
            date --iso-8601=seconds
            uname -a
            echo "\n### Python"
            python --version
            pip --version
            echo "\n### Java"
            java -version 2>&1
            echo "\n### Build tools"
            buildozer --version
            cython --version
            git --version
            echo "\n### Android environment"
            env | grep -E '^(ANDROID|JAVA|PATH|CCACHE)' | sort || true
          } | tee ci-artifacts/toolchain.txt

      - name: Build APK with Buildozer
        env:
          # Use ccache to make rebuilds much faster.
          USE_CCACHE: "1"
          CCACHE_DIR: ${{ github.workspace }}/.ccache
        run: |
          set -o pipefail
          mkdir -p ci-artifacts
          # `buildozer -v android debug` builds a debug APK. Switch to
          # `release` once you have a keystore configured.
          # Keep the complete verbose log even when Buildozer fails. This is
          # uploaded below with the SDK/build diagnostics for easy triage,
          # and the failure cause is also surfaced as check annotations.
          buildozer -v android debug 2>&1 | tee ci-artifacts/buildozer.log
          # Collect whatever APK buildozer produced.
          ls -la bin/ 2>&1 | tee -a ci-artifacts/buildozer.log || true
          find . -maxdepth 3 -name "*.apk" -print | tee -a ci-artifacts/buildozer.log || true

      - name: Surface build failure cause
        # When the build step fails, the console log alone can be hard to
        # retrieve; extract the *actual* error from buildozer.log (the last
        # lines are usually just an env dump) and emit it as check
        # annotations so the root cause is visible via the API / checks UI.
        if: failure()
        run: |
          LOG="${{ github.workspace }}/ci-artifacts/buildozer.log"
          echo "===== log size ====="
          wc -l "$LOG" 2>/dev/null || echo "(no buildozer.log found)"
          { echo "--- df ---"; df -h / /tmp 2>/dev/null; echo "--- du ---"; du -sh "${{ github.workspace }}/.buildozer" "$HOME/.buildozer" 2>/dev/null; } > /tmp/disk.txt 2>&1 || true
          cat /tmp/disk.txt
          python3 - "$LOG" <<'EOF'
          import re, sys
          ansi = re.compile(r"\x1b\[[0-9;]*m")
          try:
              with open(sys.argv[1], errors="replace") as f:
                  raw = f.read().splitlines()
          except OSError:
              print("::error::buildozer.log not found; build failed before logging started")
              sys.exit(0)
          lines = [ansi.sub("", ln).rstrip() for ln in raw]
          n = len(lines)
          def esc(s):
              return s.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
          def emit(title, numbered):
              for j in range(0, len(numbered), 12):
                  chunk = numbered[j:j + 12]
                  print(f"::error::buildozer {title}:%0A{esc(chr(10).join(chunk))}")
          # NOTE: annotations display newest-first, so emit least-important first.
          # 0) Disk usage (rules out no-space-left failures).
          try:
              with open("/tmp/disk.txt", errors="replace") as f:
                  emit("disk", [ln.rstrip()[:400] for ln in f.read().splitlines() if ln.strip()])
          except OSError:
              pass
          # 1) Error-pattern matches (numbered, deduped, most recent last).
          pats = re.compile(r"Error|ERROR|FAILED|Failed|failed to|Exception|FATAL|Caused by|BUILD FAILED|Recipe .* failed|not found|No such|Cannot |Conflict|Unsatisfiable|returned non-zero|exit code|raise |undefined reference|ld returned")
          seen, hits = set(), []
          for i, ln in enumerate(lines):
              s = ln.strip()
              if not s or "#     " in ln[:8]:
                  continue  # skip env-dump lines
              if pats.search(s) and s not in seen:
                  seen.add(s)
                  hits.append(f"{i+1}: {s[:400]}")
          emit("error-scan", hits[-24:] or ["(no error-pattern matches)"])
          # 2) Last buildozer/p4a commands that were executed.
          runs = [i for i, ln in enumerate(lines) if ln.strip().startswith(("# Run ", "# Command failed"))]
          emit("last-commands", [f"{i+1}: {lines[i][:400]}" for i in runs[-6:]] or ["(no '# Run' lines)"])
          # 3) Python traceback (the real exception is at its end).
          tb_idx = [i for i, ln in enumerate(lines) if "Traceback (most recent call last)" in ln]
          if tb_idx:
              i = tb_idx[-1]
              emit("traceback", [f"{k+1}: {lines[k]}" for k in range(i, min(i + 20, n))])
              # 4) The ~48 lines BEFORE the traceback: this is where the
              # failing command's stderr/stdout actually appears.
              lo = max(0, i - 48)
              emit("pre-traceback", [f"{k+1}: {lines[k][:400]}" for k in range(lo, i)])
          else:
              emit("traceback", ["(no Python traceback in log)"])
          # 5) Raw tail for context.
          emit("tail", [f"{i+1}: {lines[i][:400]}" for i in range(max(0, n - 12), n)])
          EOF

      - name: Verify APK was produced
        run: |
          set -e
          APK=$(ls -1 bin/*.apk 2>/dev/null | head -n 1 || true)
          if [ -z "$APK" ]; then
            echo "::error::No APK file found in bin/. Build may have failed."
            ls -la
            exit 1
          fi
          echo "APK_PATH=$APK" >> "$GITHUB_ENV"
          echo "Built APK: $APK ($(du -h "$APK" | cut -f1))"

      - name: Collect failure diagnostics
        if: always()
        run: |
          mkdir -p ci-artifacts
          {
            echo "## Build diagnostics"
            echo "Workflow: $GITHUB_WORKFLOW"
            echo "Run: $GITHUB_RUN_ID"
            echo "Commit: $GITHUB_SHA"
            echo "Runner: $RUNNER_OS / $RUNNER_ARCH"
            echo "\n### Workspace"
            df -h
            du -sh .buildozer 2>/dev/null || true
            find bin .buildozer -maxdepth 3 -type f \( -name '*.apk' -o -name '*.log' \) -print 2>/dev/null | head -100 || true
            echo "\n### Recent Buildozer logs"
            find .buildozer -type f -name '*.log' -print -exec tail -200 {} \; 2>/dev/null | tail -2000 || true
          } > ci-artifacts/diagnostics.txt

      - name: Upload APK as workflow artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: downloadsx-apk-${{ github.run_number }}
          path: ${{ env.APK_PATH }}
          if-no-files-found: error
          retention-days: 30

      - name: Upload build report and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: downloadsx-build-report-${{ github.run_number }}
          path: ci-artifacts/
          if-no-files-found: warn
          retention-days: 30
          compression-level: 6

      - name: Attach APK to GitHub Release (tag pushes only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.APK_PATH }}
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
