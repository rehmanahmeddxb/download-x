name: Build Android APK

# Run the APK build on every push to main, plus manual triggers.
# The signed (or debug) APK is published as a workflow artifact.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke-test:
    name: Desktop smoke test (fail fast)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install app dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile all sources
        run: python -m compileall -q .

      - name: Run smoke test
        # Boots the Flask app, checks every /api/* path used by the
        # frontend exists, and exercises the API contract. A failure here
        # would ship as "APK installs but instantly closes / dead UI".
        run: python .github/smoke_test.py

      - name: Install APK-only launcher deps (for strip validation)
        # The desktop app doesn't need Kivy, but the APK does -- and the
        # file blacklist strips parts of it, so validate against the real
        # packages. (filetype is imported unconditionally by kivy.core.image.)
        run: pip install kivy filetype

      - name: Check APK file blacklist is up to date
        # The yt-dlp section of p4a-blacklist.txt is generated from the
        # pinned yt-dlp; fail if it drifted instead of shipping stale patterns.
        run: python .github/generate_blacklist.py --check

      - name: Validate APK file blacklist
        # Simulates the APK packer's file strip and re-runs the whole smoke
        # suite against the stripped tree. Catches "stripped a file the app
        # needs" without waiting 40 minutes for an APK that crashes on boot.
        run: python .github/strip_check.py

  build-apk:
    name: Build APK (Buildozer / python-for-android)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    needs: [smoke-test]
    env:
      # Inherited by p4a's hostpython and per-architecture pip subprocesses.
      PIP_CONSTRAINT: ${{ github.workspace }}/.github/build-constraints.txt

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache Buildozer / p4a build
        # v3 avoids restoring licenses-only SDKs or cross-SDK tool symlinks.
        # Speeds up repeat builds by caching ~/.buildozer (downloaded
        # Android SDK / NDK / recipes / .gradle outputs). The first run
        # will still be slow because everything has to be downloaded.
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            ~/Library/buildozer
          key: ${{ runner.os }}-buildozer-sdk-v3-${{ hashFiles('buildozer.spec', 'requirements.txt', 'main.py', '.github/workflows/build-apk.yml', '.github/build-constraints.txt') }}
          restore-keys: |
            ${{ runner.os }}-buildozer-sdk-v3-

      - name: Install Buildozer system dependencies
        # python-for-android needs these system packages on Ubuntu to
        # compile native recipes and run the SDK tooling.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            ccache \
            git \
            libffi-dev \
            libssl-dev \
            libbz2-dev \
            libreadline-dev \
            libsqlite3-dev \
            libncurses5-dev \
            libncursesw5-dev \
            xz-utils \
            tk-dev \
            liblzma-dev \
            python3-pip \
            python3-venv \
            autoconf \
            automake \
            libtool \
            libltdl-dev \
            cmake \
            zlib1g-dev \
            pkg-config \
            unzip \
            zip \
            openjdk-17-jdk-headless \
            wget \
            curl

      - name: Verify native build prerequisites
        # libffi's autogen.sh needs ltdl.m4 from libltdl-dev. libtool alone
        # does not provide LT_SYS_SYMBOL_USCORE on a minimal runner.
        run: |
          set -euo pipefail
          for tool in autoconf automake aclocal libtoolize cmake; do
            command -v "$tool"
          done
          LTDL_M4="$(aclocal --print-ac-dir)/ltdl.m4"
          if ! grep -q 'AC_DEFUN(\[LT_SYS_SYMBOL_USCORE\]' "$LTDL_M4"; then
            echo "::error::Missing LT_SYS_SYMBOL_USCORE macro; install libltdl-dev"
            exit 1
          fi

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade buildozer cython

      - name: Prepare Android SDK tools
        # A licenses-only SDK directory makes Buildozer skip SDK installation.
        # Copy the runner's command-line tools into this SDK at the legacy
        # tools/bin path expected by Buildozer 1.6. License prompts are handled
        # by android.accept_sdk_license in buildozer.spec, not fabricated files.
        run: |
          set -euo pipefail
          SDK_ROOT="$HOME/.buildozer/android/platform/android-sdk"
          SDK_TOOLS="${ANDROID_HOME:?ANDROID_HOME must point to the runner SDK}/cmdline-tools/latest"
          if [ ! -x "$SDK_TOOLS/bin/sdkmanager" ]; then
            echo "::error::Android command-line tools missing at $SDK_TOOLS"
            exit 1
          fi
          mkdir -p "$SDK_ROOT"
          # Do not symlink tools across SDK roots: avdmanager resolves the
          # symlink and reports platforms from the runner SDK instead.
          if [ ! -d "$SDK_ROOT/tools" ]; then
            cp -a "$SDK_TOOLS/." "$SDK_ROOT/tools"
          fi
          export ANDROID_HOME="$SDK_ROOT"
          export ANDROID_SDK_ROOT="$SDK_ROOT"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          "$SDK_ROOT/tools/bin/sdkmanager" --sdk_root="$SDK_ROOT" --version

      - name: Record toolchain information
        run: |
          set -o pipefail
          mkdir -p ci-artifacts
          {
            echo "## Toolchain"
            date --iso-8601=seconds
            uname -a
            echo "\n### Python"
            python --version
            pip --version
            echo "\n### Java"
            java -version 2>&1
            echo "\n### Build tools"
            buildozer --version
            cython --version
            git --version
            echo "\n### Android environment"
            env | grep -E '^(ANDROID|JAVA|PATH|CCACHE)' | sort || true
          } | tee ci-artifacts/toolchain.txt

      - name: Build APK with Buildozer
        env:
          # Use ccache to make rebuilds much faster.
          USE_CCACHE: "1"
          CCACHE_DIR: ${{ github.workspace }}/.ccache
        run: |
          set -o pipefail
          mkdir -p ci-artifacts
          # Keep the complete verbose log even when Buildozer fails. This is
          # uploaded below with the SDK/build diagnostics for easy triage.
          buildozer -v android debug 2>&1 | tee ci-artifacts/buildozer.log
          # Collect whatever APK buildozer produced.
          ls -la bin/ 2>&1 | tee -a ci-artifacts/buildozer.log || true
          find . -maxdepth 3 -name "*.apk" -print | tee -a ci-artifacts/buildozer.log || true

      - name: Verify APK was produced
        run: |
          set -e
          APK=$(ls -1 bin/*.apk 2>/dev/null | head -n 1 || true)
          if [ -z "$APK" ]; then
            echo "::error::No APK file found in bin/. Build may have failed."
            ls -la
            exit 1
          fi
          echo "APK_PATH=$APK" >> "$GITHUB_ENV"
          echo "Built APK: $APK ($(du -h "$APK" | cut -f1))"

      - name: Report APK size and contents
        # Answers "why is the APK so big?" with data: total size, per-arch
        # native libs, and the largest bundled entries. Non-fatal by design.
        run: |
          set +e
          mkdir -p ci-artifacts
          python3 - "$APK_PATH" > ci-artifacts/apk-contents.txt <<'EOF'
          import os, sys, zipfile
          apk = sys.argv[1]
          size_mb = os.path.getsize(apk) / 1024**2
          print(f"APK: {apk}  ({size_mb:.1f} MB on disk)")
          with zipfile.ZipFile(apk) as zf:
              infos = zf.infolist()
              total_c = sum(i.compress_size for i in infos)
              total_u = sum(i.file_size for i in infos)
              print(f"entries: {len(infos)}, "
                    f"compressed: {total_c/1024**2:.1f} MB, "
                    f"uncompressed: {total_u/1024**2:.1f} MB")
              archs = {}
              for i in infos:
                  if i.filename.startswith("lib/") and i.filename.endswith(".so"):
                      parts = i.filename.split("/")
                      if len(parts) >= 3:
                          archs[parts[1]] = archs.get(parts[1], 0) + i.compress_size
              if archs:
                  print("native libs per ABI (compressed):")
                  for abi, n in sorted(archs.items()):
                      print(f"  {abi}: {n/1024**2:.1f} MB")
              else:
                  print("WARNING: no lib/<abi>/*.so entries found!")
              for needle, label in (("database.db", "bundled desktop database"),
                                    ("__pycache__", "pycache")):
                  hits = [i.filename for i in infos if needle in i.filename]
                  if hits:
                      print(f"WARNING: APK contains {label}: {hits[:5]}")
              print("largest 30 entries (compressed):")
              for i in sorted(infos, key=lambda x: -x.compress_size)[:30]:
                  print(f"  {i.compress_size/1024:9.0f} KB  {i.filename}")
          EOF
          cat ci-artifacts/apk-contents.txt
          {
            echo "## APK size report"
            echo '```'
            cat ci-artifacts/apk-contents.txt
            echo '```'
            echo ""
            echo "### Manifest (aapt, best effort)"
            AAPT=$(ls "$ANDROID_HOME"/build-tools/*/aapt 2>/dev/null | head -n 1)
            if [ -n "$AAPT" ]; then
              "$AAPT" dump badging "$APK_PATH" 2>/dev/null | head -n 20 || echo "(aapt failed)"
            else
              echo "(aapt not found)"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Collect failure diagnostics
        if: always()
        run: |
          mkdir -p ci-artifacts
          {
            echo "## Build diagnostics"
            echo "Workflow: $GITHUB_WORKFLOW"
            echo "Run: $GITHUB_RUN_ID"
            echo "Commit: $GITHUB_SHA"
            echo "Runner: $RUNNER_OS / $RUNNER_ARCH"
            echo "\n### Workspace"
            df -h
            du -sh .buildozer 2>/dev/null || true
            find bin .buildozer -maxdepth 3 -type f \( -name '*.apk' -o -name '*.log' \) -print 2>/dev/null | head -100 || true
            echo "\n### Recent Buildozer logs"
            find .buildozer -type f -name '*.log' -print -exec tail -200 {} \; 2>/dev/null | tail -2000 || true
          } > ci-artifacts/diagnostics.txt

      - name: Upload APK as workflow artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: downloadsx-apk-${{ github.run_number }}
          path: ${{ env.APK_PATH }}
          if-no-files-found: error
          retention-days: 30

      - name: Upload build report and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: downloadsx-build-report-${{ github.run_number }}
          path: ci-artifacts/
          if-no-files-found: warn
          retention-days: 30
          compression-level: 6

      - name: Attach APK to GitHub Release (tag pushes only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.APK_PATH }}
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
