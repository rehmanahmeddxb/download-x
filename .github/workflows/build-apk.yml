name: Build Android APK

# Run the APK build on every push to main, plus manual triggers.
# The signed (or debug) APK is published as a workflow artifact.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    name: Build APK (Buildozer / python-for-android)
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache Buildozer / p4a build
        # Speeds up repeat builds by caching ~/.buildozer (downloaded
        # Android SDK / NDK / recipes / .gradle outputs). The first run
        # will still be slow because everything has to be downloaded.
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            ~/Library/buildozer
          key: ${{ runner.os }}-buildozer-${{ hashFiles('buildozer.spec', 'requirements.txt', 'main.py') }}
          restore-keys: |
            ${{ runner.os }}-buildozer-

      - name: Install Buildozer system dependencies
        # python-for-android needs these system packages on Ubuntu to
        # compile native recipes and run the SDK tooling.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            ccache \
            git \
            libffi-dev \
            libssl-dev \
            libbz2-dev \
            libreadline-dev \
            libsqlite3-dev \
            libncurses5-dev \
            libncursesw5-dev \
            xz-utils \
            tk-dev \
            liblzma-dev \
            python3-pip \
            python3-venv \
            autoconf \
            libtool \
            pkg-config \
            unzip \
            zip \
            openjdk-17-jdk-headless \
            wget \
            curl
          # sdkmanager / Gradle need a JDK on PATH; export JAVA_HOME too.
          echo "JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64" >> "$GITHUB_ENV"
          java -version

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade buildozer cython

      - name: Sanitize cached Android SDK
        # Buildozer treats ANY existing SDK dir as "SDK found" and skips
        # installing the command-line tools, then fails when sdkmanager is
        # missing. A failed run can therefore poison the ~/.buildozer
        # cache with a half-installed SDK (e.g. only `licenses/`).
        # Drop such a broken dir so buildozer does a clean SDK install.
        # (SDK licences themselves are accepted via
        # `android.accept_sdk_license = True` in buildozer.spec.)
        run: |
          SDK="$HOME/.buildozer/android/platform/android-sdk"
          if [ -d "$SDK" ] && [ ! -d "$SDK/cmdline-tools" ] && [ ! -x "$SDK/tools/bin/sdkmanager" ]; then
            echo "Removing incomplete cached SDK at $SDK"
            rm -rf "$SDK"
          else
            echo "Cached SDK looks usable (or absent, will be installed)."
          fi

      - name: Build APK with Buildozer
        env:
          # Use ccache to make rebuilds much faster.
          USE_CCACHE: "1"
          CCACHE_DIR: ${{ github.workspace }}/.ccache
        run: |
          set -o pipefail
          # `buildozer -v android debug` builds a debug APK. Switch to
          # `release` once you have a keystore configured.
          # Tee all output to buildozer.log so the log can be uploaded as
          # an artifact (and the failure tail surfaced as annotations)
          # even when the build fails.
          buildozer -v android debug 2>&1 | tee "${{ github.workspace }}/buildozer.log"
          # Collect whatever APK buildozer produced.
          ls -la bin/ 2>/dev/null || true
          find . -maxdepth 3 -name "*.apk" -print

      - name: Surface build failure tail
        # When the build step fails, the console log alone can be hard to
        # retrieve; emit the tail of buildozer.log as check annotations so
        # the root cause is visible via the API / checks UI.
        if: failure()
        run: |
          LOG="${{ github.workspace }}/buildozer.log"
          echo "===== last 100 lines of buildozer.log ====="
          tail -n 100 "$LOG" 2>/dev/null || echo "(no buildozer.log found)"
          python3 - "$LOG" <<'EOF'
          import sys
          try:
              with open(sys.argv[1], errors="replace") as f:
                  lines = f.read().splitlines()
          except OSError:
              print("::error::buildozer.log not found; build failed before logging started")
              sys.exit(0)
          tail = lines[-80:]
          base = len(lines) - len(tail)
          def esc(s):
              return s.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
          # Emit in ~15-line chunks (annotation size limits).
          for i in range(0, len(tail), 15):
              chunk = tail[i:i + 15]
              lo, hi = base + i + 1, base + i + len(chunk)
              print(f"::error::buildozer failed (log lines {lo}-{hi}):%0A{esc(chr(10).join(chunk))}")
          EOF

      - name: Upload build log (always)
        # Guarantee the run produces *some* artifact even on failure, so a
        # failed build is always diagnosable from the Actions UI.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: downloadsx-build-log
          path: buildozer.log
          if-no-files-found: warn
          retention-days: 14

      - name: Verify APK was produced
        run: |
          set -e
          APK=$(ls -1 bin/*.apk 2>/dev/null | head -n 1)
          if [ -z "$APK" ]; then
            echo "::error::No APK file found in bin/. Build may have failed."
            ls -la
            exit 1
          fi
          echo "APK_PATH=$APK" >> "$GITHUB_ENV"
          echo "Built APK: $APK ($(du -h "$APK" | cut -f1))"

      - name: Upload APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: downloadsx-apk
          path: ${{ env.APK_PATH }}
          if-no-files-found: error
          retention-days: 30

      - name: Attach APK to GitHub Release (tag pushes only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.APK_PATH }}
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
